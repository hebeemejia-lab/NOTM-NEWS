<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOTM NEWS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>NOTM NEWS</h1>
  </header>
  <div class="layout">
    <aside class="ads ads-left">
      <!-- Google AdSense: Bloque izquierdo -->
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
           data-ad-slot="1111111111"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </aside>
    <main>
      <section id="featured-carousel-container">
        <button id="prev-featured" class="carousel-arrow">&#8592;</button>
        <div id="featured-carousel"></div>
        <button id="next-featured" class="carousel-arrow">&#8594;</button>
      </section>
      <section id="news-list"></section>
    </main>
    <aside class="ads ads-right">
      <!-- Google AdSense: Bloque derecho -->
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
           data-ad-slot="2222222222"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </aside>
  </div>
  <!-- Google AdSense script global -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
  <script src="app.js"></script>
</body>
</html>
